<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #d4f040;
    --accent-dim: rgba(212, 240, 64, 0.12);
    --text: #f0ede6;
    --text-muted: #6b6b6b;
    --done: #3a3a3a;
    --done-text: #4a4a4a;
    --red: #ff4d4d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 20px;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(212,240,64,0.05) 0%, transparent 60%);
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
  }

  header { margin-bottom: 40px; }

  .label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    font-weight: 900;
    line-height: 1;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  .stats strong { color: var(--text); }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }

  #task-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #task-input::placeholder { color: var(--text-muted); }

  #task-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,240,64,0.1);
  }

  #add-btn {
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: 8px;
    padding: 14px 22px;
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
    line-height: 1;
  }

  #add-btn:hover { transform: scale(1.06); }
  #add-btn:active { transform: scale(0.96); }

  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: 8px;
    padding: 4px;
    border: 1px solid var(--border);
  }

  .filter-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .filter-btn.active {
    background: var(--accent);
    color: #0e0e0e;
    font-weight: 700;
  }

  #task-list { list-style: none; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    transition: border-color 0.2s, transform 0.2s, opacity 0.3s;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-item:hover { border-color: #3e3e3e; transform: translateX(2px); }

  .task-item.done {
    background: var(--done);
    border-color: var(--done);
    opacity: 0.6;
  }

  .check-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
    color: transparent;
    font-size: 12px;
  }

  .task-item.done .check-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e0e;
  }

  .task-text {
    flex: 1;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
    cursor: pointer;
  }

  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--done-text);
  }

  .task-edit-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 4px 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
  }

  .task-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .task-item:hover .task-actions { opacity: 1; }

  .action-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 13px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }

  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.del:hover { border-color: var(--red); color: var(--red); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  .footer {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .clear-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="label">// daily tasks</div>
    <h1>What needs<br>to get <span>done.</span></h1>
    <div class="stats">
      <span><strong id="stat-total">0</strong> tasks</span>
      <span><strong id="stat-done">0</strong> completed</span>
      <span><strong id="stat-left">0</strong> remaining</span>
    </div>
  </header>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a new task..." maxlength="200" />
    <button id="add-btn">+</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <ul id="task-list"></ul>

  <div class="footer">
    <button class="clear-btn" id="clear-btn">Clear completed</button>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let filter = 'all';
  let editingId = null;

  const input = document.getElementById('task-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');
  const progressFill = document.getElementById('progress-fill');
  const statTotal = document.getElementById('stat-total');
  const statDone = document.getElementById('stat-done');
  const statLeft = document.getElementById('stat-left');
  const clearBtn = document.getElementById('clear-btn');

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false });
    input.value = '';
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const el = document.querySelector('.task-edit-input');
    if (el) { el.focus(); el.select(); }
  }

  function saveEdit(id, val) {
    const v = val.trim();
    const t = tasks.find(t => t.id === id);
    if (t && v) { t.text = v; }
    editingId = null;
    save();
    render();
  }

  function render() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const left = total - done;
    statTotal.textContent = total;
    statDone.textContent = done;
    statLeft.textContent = left;
    progressFill.style.width = total ? (done / total * 100) + '%' : '0%';

    const filtered = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done') return t.done;
      return true;
    });

    list.innerHTML = '';

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">${filter === 'done' ? '🎯' : '✦'}</div>${filter === 'done' ? 'Nothing completed yet.' : filter === 'active' ? 'All tasks done!' : 'No tasks yet. Add one above.'}</div>`;
      return;
    }

    filtered.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'check-btn';
      check.innerHTML = task.done ? '✓' : '';
      check.title = task.done ? 'Undo' : 'Complete';
      check.onclick = () => toggleTask(task.id);
      li.appendChild(check);

      if (editingId === task.id) {
        const inp = document.createElement('input');
        inp.className = 'task-edit-input';
        inp.value = task.text;
        inp.onblur = () => saveEdit(task.id, inp.value);
        inp.onkeydown = e => {
          if (e.key === 'Enter') saveEdit(task.id, inp.value);
          if (e.key === 'Escape') { editingId = null; render(); }
        };
        li.appendChild(inp);
      } else {
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;
        span.ondblclick = () => startEdit(task.id);
        li.appendChild(span);
      }

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'action-btn';
      editBtn.innerHTML = '✎';
      editBtn.title = 'Edit';
      editBtn.onclick = () => startEdit(task.id);

      const delBtn = document.createElement('button');
      delBtn.className = 'action-btn del';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Delete';
      delBtn.onclick = () => deleteTask(task.id);

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      li.appendChild(actions);

      list.appendChild(li);
    });
  }

  addBtn.onclick = addTask;
  input.onkeydown = e => { if (e.key === 'Enter') addTask(); };

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
  });

  clearBtn.onclick = () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  };

  render();
</script>
</body>
</html>
